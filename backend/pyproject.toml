[project]
name = "supply-chain-dashboard-backend"
version = "0.1.0"
description = "Local-first supply-chain CSV analytics API (Phase 3 foundation shell)"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<0.117",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "uvicorn>=0.30,<0.36",
  "pandas>=2.2,<3",
  "pyarrow>=15,<22",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "pytest>=8.0,<9",
  "ruff>=0.8,<0.10",
  "mypy>=1.10,<2",
  "pandas-stubs>=3.0,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
